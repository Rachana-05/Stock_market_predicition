name: Stock Prediction CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install scikit-learn xgboost yfinance ta pandas numpy joblib mlflow fastapi httpx requests pytest pylint uvicorn pennylane

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/stock_v2_export/stock_v2" >> $GITHUB_ENV

      - name: Test 1 — Feature Engineering
        run: |
          python -c "
          import sys, os, numpy as np, pandas as pd
          import config
          config.BASE_DIR     = '/tmp/sv2'
          config.SAVED_MODELS = '/tmp/sv2/saved_models'
          config.RESULTS_DIR  = '/tmp/sv2/results'
          config.DATA_DIR     = '/tmp/sv2/data_cache'
          config.MLFLOW_URI   = 'file:////tmp/sv2/mlruns'
          for d in [config.SAVED_MODELS, config.RESULTS_DIR, config.DATA_DIR]:
              os.makedirs(d, exist_ok=True)
          from data.features import compute_features, FEATURE_COLS
          assert len(FEATURE_COLS) == 45
          n = 300
          p = np.cumprod(1 + np.random.randn(n)*0.012)*2000
          df = pd.DataFrame({
              'Open':p*(1+np.random.randn(n)*0.002),
              'High':p*(1+np.abs(np.random.randn(n))*0.005),
              'Low':p*(1-np.abs(np.random.randn(n))*0.005),
              'Close':p,'Volume':np.random.lognormal(14,.5,n)*1000
          }, index=pd.bdate_range(end='2026-01-01', periods=n))
          df_feat = compute_features(df, None)
          assert len(df_feat) >= 50
          assert df_feat[FEATURE_COLS].isnull().sum().sum() == 0
          assert set(df_feat['target'].unique()).issubset({0,1})
          print('PASS Feature Engineering')
          "

      - name: Test 2 — XGBoost
        run: |
          python -c "
          import numpy as np, os
          import config
          from sklearn.preprocessing import StandardScaler
          from models.ml_models import run_xgboost
          config.SAVED_MODELS='/tmp/sv2/saved_models'
          config.RESULTS_DIR='/tmp/sv2/results'
          X_tr=np.random.randn(200,45).astype(np.float32)
          X_te=np.random.randn(50,45).astype(np.float32)
          y_tr=(np.random.randn(200)>0).astype(np.int64)
          y_te=(np.random.randn(50)>0).astype(np.int64)
          sc=StandardScaler()
          X_tr=sc.fit_transform(X_tr); X_te=sc.transform(X_te)
          m,p,pte = run_xgboost(X_tr,y_tr,X_te,y_te)
          assert 0 <= m['fit_score'] <= 1
          assert 0 <= m['predict_score'] <= 1
          print('PASS XGBoost')
          "

      - name: Test 3 — DNN
        run: |
          python -c "
          import numpy as np
          import config
          from models.dl_models import run_dnn
          config.SAVED_MODELS='/tmp/sv2/saved_models'
          config.EPOCHS=2
          X_tr=np.random.randn(150,45).astype(np.float32)
          X_te=np.random.randn(40,45).astype(np.float32)
          y_tr=(np.random.randn(150)>0).astype(np.int64)
          y_te=(np.random.randn(40)>0).astype(np.int64)
          m,p,pte = run_dnn(X_tr,y_tr,X_te,y_te)
          assert 0 <= m['fit_score'] <= 1
          print('PASS DNN')
          "

      - name: Test 4 — LSTM/GRU
        run: |
          python -c "
          import torch
          from models.ml_models import LSTMModel, GRUModel
          seq = torch.randn(4,30,45)
          assert LSTMModel(45)(seq).shape == (4,2)
          assert GRUModel(45)(seq).shape == (4,2)
          print('PASS LSTM & GRU')
          "

      - name: Test 5 — Ensemble
        run: |
          python -c "
          import numpy as np
          import config
          from models.ensemble import run_stacking_ensemble
          config.SAVED_MODELS='/tmp/sv2/saved_models'
          y_tr=(np.random.randn(200)>0).astype(int)
          y_te=(np.random.randn(50)>0).astype(int)
          ptr={m:(np.random.randn(200)>0).astype(int) for m in ['LSTM','GRU','XGBoost']}
          pte={m:(np.random.randn(50)>0).astype(int) for m in ['LSTM','GRU','XGBoost']}
          m,_,_,_,vote = run_stacking_ensemble(ptr,y_tr,pte,y_te)
          assert 0 <= vote['accuracy'] <= 1
          print('PASS Ensemble')
          "

      - name: Test 6 — QSVM
        run: |
          python -c "
          import numpy as np
          import config
          from models.qml_models import run_qsvm_qiskit
          config.SAVED_MODELS='/tmp/sv2/saved_models'
          config.N_QUBITS=4
          X_tr=np.random.randn(60,45).astype(np.float32)
          X_te=np.random.randn(20,45).astype(np.float32)
          y_tr=(np.random.randn(60)>0).astype(np.int64)
          y_te=(np.random.randn(20)>0).astype(np.int64)
          m,p,pte = run_qsvm_qiskit(X_tr,y_tr,X_te,y_te,n_sample=25)
          assert 0 <= m['fit_score'] <= 1
          print('PASS QSVM')
          "

      - name: Test 7 — FastAPI health
        run: |
          python -c "
          import config
          print('PASS FastAPI config load')
          "
